<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wish Master Emon</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at center, #170024 0%, #08000d 100%);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      user-select: none;
      overflow-x: hidden;
    }

    .container {
      max-width: 440px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      background: rgba(255, 255, 255, 0.04);
      padding: 24px 18px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .app-icon {
      width: 95px;
      height: 95px;
      border-radius: 24px;
      box-shadow: 0 8px 24px rgba(220, 38, 127, 0.35);
      border: 2px solid rgba(255, 255, 255, 0.15);
      object-fit: cover;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      background: linear-gradient(135deg, #ff77e9, #9b51e0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .sub-text {
      color: #c9b8db;
      font-size: 13px;
    }

    .input-box {
      width: 100%;
      text-align: left;
      margin-top: 5px;
    }

    .input-box label {
      display: block;
      font-size: 13px;
      color: #ffb74d;
      margin-bottom: 6px;
      margin-left: 4px;
    }

    .input-box input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.4);
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .input-box input:focus {
      border-color: #e91e63;
    }

    .audio-upload-wrapper {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px dashed rgba(255, 255, 255, 0.25);
      border-radius: 14px;
      padding: 12px;
      text-align: center;
      margin-top: 4px;
    }

    .file-btn {
      display: inline-block;
      padding: 9px 18px;
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #00b09b, #96c93d);
      border-radius: 25px;
      cursor: pointer;
    }

    #fileAudioInput {
      display: none;
    }

    #audioStatus {
      display: block;
      font-size: 12px;
      color: #a0aec0;
      margin-top: 6px;
      word-break: break-all;
    }

    .action-btn {
      width: 100%;
      margin-top: 10px;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      background: linear-gradient(135deg, #e91e63, #8e24aa);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(233, 30, 99, 0.4);
      transition: transform 0.2s;
    }

    .action-btn:active {
      transform: scale(0.97);
    }

    #resultContainer {
      width: 100%;
      margin-top: 12px;
      display: none;
    }

    .link-display {
      background: #000;
      padding: 10px;
      border-radius: 10px;
      color: #00e676;
      font-size: 12px;
      word-break: break-all;
      margin-bottom: 8px;
      border: 1px solid rgba(0, 230, 118, 0.3);
    }

    .copy-btn {
      width: 100%;
      padding: 11px;
      border-radius: 25px;
      border: none;
      background: #00b09b;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <img src="favicon.png" alt="App Logo" class="app-icon" onerror="this.style.display='none'">
    
    <h1>Wish Master Emon</h1>
    <p class="sub-text">নাম ও অডিও দিয়ে এক ক্লিকে উইশ লিংক তৈরি করুন</p>

    <!-- নাম দেওয়ার ঘর -->
    <div class="input-box">
      <label>আপনার নাম:</label>
      <input type="text" id="targetName" placeholder="নাম লিখুন...">
    </div>

    <!-- গান যুক্ত করার অপশন -->
    <div class="input-box">
      <label>গানের অডিও লিংক (URL) দিন:</label>
      <input type="text" id="songUrl" placeholder="https://...mp3 (অথবা খালি রাখুন)">
    </div>

    <div class="audio-upload-wrapper">
      <label for="fileAudioInput" class="file-btn">📂 ফোন থেকে অডিও ফাইল বেছে নিন</label>
      <input type="file" id="fileAudioInput" accept="audio/*">
      <span id="audioStatus">কোনো অডিও ফাইল নির্বাচন করা হয়নি</span>
    </div>

    <button class="action-btn" onclick="buildWishLink()">উইশ লিংক তৈরি করুন 🚀</button>

    <!-- লিংক দেখানোর এরিয়া -->
    <div id="resultContainer">
      <div class="link-display" id="generatedLink"></div>
      <button class="copy-btn" onclick="copyResultLink()">📋 লিংক কপি করুন</button>
    </div>
  </div>

  <script>
    let customAudioData = "";

    // ফোন থেকে গান সিলেক্ট করলে তা স্বয়ংক্রিয়ভাবে প্রসেস হবে
    document.getElementById('fileAudioInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      const statusSpan = document.getElementById('audioStatus');
      
      if (file) {
        statusSpan.innerText = "অডিও লোড হচ্ছে: " + file.name;
        const reader = new FileReader();
        reader.onload = function(evt) {
          customAudioData = evt.target.result;
          statusSpan.innerText = "অডিও যুক্ত হয়েছে: " + file.name + " ✔";
          statusSpan.style.color = "#00e676";
          // ফাইল সিলেক্ট হলে ইউআরএল ফিল্ড ক্লিয়ার করে দেওয়া
          document.getElementById('songUrl').value = "";
        };
        reader.readAsDataURL(file);
      }
    });

    // উইশ লিংক জেনারেট ফাংশন
    function buildWishLink() {
      const name = document.getElementById('targetName').value.trim();
      const songUrlInput = document.getElementById('songUrl').value.trim();

      if (!name) {
        alert("দয়া করে একটি নাম লিখুন!");
        return;
      }

      // wish.html পেজের ফুল লিংক প্রস্তুত
      const currentUrl = window.location.href.split('?')[0];
      const targetBase = currentUrl.replace('index.html', 'wish.html');

      let audioSource = "";
      if (songUrlInput) {
        audioSource = songUrlInput;
      } else if (customAudioData) {
        audioSource = customAudioData;
      } else {
        audioSource = "music.mp3"; // ডিফল্ট ফলব্যাক
      }

      // লিংক প্যারামিটার তৈরি
      const finalUrl = `${targetBase}?name=${encodeURIComponent(name)}&song=${encodeURIComponent(audioSource)}`;

      document.getElementById('generatedLink').innerText = finalUrl;
      document.getElementById('resultContainer').style.display = "block";
    }

    function copyResultLink() {
      const linkText = document.getElementById('generatedLink').innerText;
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(linkText);
      } else {
        const dummy = document.createElement("textarea");
        dummy.value = linkText;
        document.body.appendChild(dummy);
        dummy.select();
        document.execCommand("copy");
        document.body.removeChild(dummy);
      }
      alert("উইশ লিংকটি কপি হয়েছে!");
    }
  </script>
</body>
</html>
