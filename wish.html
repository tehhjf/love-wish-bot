<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Special Surprise For You</title>
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Anek Bangla', sans-serif;
  -webkit-tap-highlight-color: transparent;
}

body {
  background: radial-gradient(circle at 50% 20%, #2b001d 0%, #120019 60%, #05000a 100%);
  color: #fff;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 16px 12px;
  overflow-x: hidden;
  position: relative;
}

/* Floating Hearts Background */
.heart-bg {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 1;
  overflow: hidden;
}

.floating-heart {
  position: absolute;
  color: rgba(255, 45, 117, 0.35);
  font-size: 18px;
  animation: floatUp linear infinite;
}

@keyframes floatUp {
  0% { transform: translateY(105vh) scale(0.6) rotate(0deg); opacity: 0; }
  20% { opacity: 0.8; }
  80% { opacity: 0.8; }
  100% { transform: translateY(-15vh) scale(1.2) rotate(360deg); opacity: 0; }
}

/* Glass Container Frame */
.main-wrapper {
  width: 100%;
  max-width: 420px;
  background: rgba(25, 0, 35, 0.75);
  border: 1.8px solid rgba(255, 65, 130, 0.45);
  border-radius: 32px;
  padding: 24px 18px;
  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);
  box-shadow: 0 15px 45px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(255, 45, 117, 0.15);
  position: relative;
  z-index: 10;
  text-align: center;
}

/* Music Control Icon */
.music-toggle {
  position: absolute;
  top: 18px;
  right: 18px;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: rgba(255, 45, 117, 0.2);
  border: 1.5px solid #ff2d75;
  display: flex;
  justify-content: center;
  align-items: center;
  color: #ffe082;
  cursor: pointer;
  z-index: 20;
  font-size: 15px;
  box-shadow: 0 0 12px rgba(255, 45, 117, 0.4);
}

.music-toggle.spin {
  animation: rotateMusic 4s linear infinite;
}

@keyframes rotateMusic {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

/* Profile Photo Section */
.avatar-container {
  width: 110px;
  height: 110px;
  margin: 10px auto 16px;
  border-radius: 50%;
  border: 3.5px solid #ffe082;
  box-shadow: 0 0 25px rgba(255, 45, 117, 0.6);
  padding: 3px;
  background: linear-gradient(135deg, #ff2d75, #ffe082);
  animation: pulseGlow 2.5s ease-in-out infinite alternate;
}

@keyframes pulseGlow {
  0% { box-shadow: 0 0 15px rgba(255, 45, 117, 0.5); }
  100% { box-shadow: 0 0 30px rgba(255, 224, 130, 0.8); }
}

.avatar-container img {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
  background: #111;
}

/* Titles */
.title-badge {
  display: inline-block;
  padding: 4px 14px;
  border-radius: 20px;
  background: rgba(255, 45, 117, 0.2);
  border: 1px solid rgba(255, 45, 117, 0.4);
  font-size: 0.82rem;
  color: #ffe082;
  font-weight: 700;
  margin-bottom: 8px;
}

.names-heading {
  font-family: 'Poppins', sans-serif;
  font-size: 1.35rem;
  font-weight: 800;
  background: linear-gradient(135deg, #fff, #ffb3d1, #ff2d75);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 15px;
  line-height: 1.3;
}

/* Letter Scroll View */
.letter-card {
  background: rgba(0, 0, 0, 0.45);
  border: 1.2px solid rgba(255, 179, 209, 0.25);
  border-radius: 20px;
  padding: 18px 16px;
  margin-bottom: 18px;
  text-align: left;
  max-height: 220px;
  overflow-y: auto;
  position: relative;
  scrollbar-width: thin;
  scrollbar-color: #ff2d75 rgba(0, 0, 0, 0.2);
}

.letter-text {
  font-size: 0.96rem;
  line-height: 1.7;
  color: #ffccd5;
  white-space: pre-line;
  font-weight: 600;
}

/* Proposal Prompt Box */
.proposal-box {
  background: linear-gradient(135deg, rgba(255, 45, 117, 0.2), rgba(255, 224, 130, 0.15));
  border: 1.5px dashed #ff2d75;
  border-radius: 20px;
  padding: 16px 14px;
  margin-bottom: 20px;
}

.proposal-question {
  font-size: 1.05rem;
  font-weight: 700;
  color: #ffe082;
  margin-bottom: 14px;
}

/* Action Buttons (YES / NO) */
.action-buttons {
  display: flex;
  gap: 12px;
  justify-content: center;
  position: relative;
}

.btn-choice {
  flex: 1;
  padding: 12px 14px;
  border-radius: 50px;
  border: none;
  font-size: 1rem;
  font-weight: 800;
  cursor: pointer;
  transition: all 0.25s ease;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
}

.btn-accept {
  background: linear-gradient(135deg, #00e676, #00b0ff);
  color: #05000a;
  box-shadow: 0 5px 20px rgba(0, 230, 118, 0.45);
}

.btn-accept:active {
  transform: scale(0.95);
}

.btn-reject {
  background: rgba(255, 255, 255, 0.12);
  color: #fff;
  border: 1px solid rgba(255, 255, 255, 0.25);
  position: relative;
}

/* Custom Message Form */
.feedback-container {
  margin-top: 14px;
  text-align: left;
}

.feedback-container label {
  display: block;
  font-size: 0.88rem;
  color: #ffb3d1;
  font-weight: 700;
  margin-bottom: 6px;
}

.feedback-input-row {
  display: flex;
  gap: 8px;
}

.feedback-input {
  flex: 1;
  padding: 12px 14px;
  background: rgba(255, 255, 255, 0.08);
  border: 1.2px solid rgba(255, 179, 209, 0.3);
  border-radius: 16px;
  color: #fff;
  font-size: 0.94rem;
  outline: none;
}

.feedback-input:focus {
  border-color: #ff2d75;
  box-shadow: 0 0 12px rgba(255, 45, 117, 0.4);
}

.btn-send-msg {
  padding: 12px 16px;
  border-radius: 16px;
  background: #ff2d75;
  border: none;
  color: #fff;
  font-weight: 700;
  font-size: 0.95rem;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(255, 45, 117, 0.45);
}

/* Status Notifications */
.alert-popup {
  display: none;
  margin-top: 15px;
  padding: 12px;
  border-radius: 16px;
  font-size: 0.92rem;
  font-weight: 700;
  animation: fadeIn 0.3s ease;
}

.alert-success {
  background: rgba(0, 230, 118, 0.15);
  border: 1.2px solid #00e676;
  color: #85ffb9;
}

/* WhatsApp Redirection Link */
.wa-link-btn {
  display: none;
  margin-top: 12px;
  padding: 12px;
  border-radius: 50px;
  background: #25d366;
  color: #fff;
  text-decoration: none;
  font-weight: 800;
  font-size: 0.95rem;
  box-shadow: 0 5px 20px rgba(37, 211, 102, 0.45);
}

/* Footer Signature */
.site-footer {
  margin-top: 20px;
  padding-top: 12px;
  border-top: 1px dashed rgba(255, 179, 209, 0.2);
  font-size: 0.8rem;
  color: #ffe082;
  font-weight: 600;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<div class="heart-bg" id="heartBg"></div>

<div class="main-wrapper">
  <!-- Music Controller -->
  <div class="music-toggle spin" id="musicBtn" onclick="toggleAudio()">
    <i class="fa-solid fa-music"></i>
  </div>

  <!-- Profile Image -->
  <div class="avatar-container">
    <img id="avatarImg" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=300" alt="Avatar">
  </div>

  <div class="title-badge">💌 SECRET CONFESSION</div>
  <div class="names-heading" id="namesHeading">Loading Surprise...</div>

  <!-- Letter Text -->
  <div class="letter-card">
    <div class="letter-text" id="letterContent">
      অনুভূতির চিঠি লোড হচ্ছে, একটু অপেক্ষা করুন... ✨
    </div>
  </div>

  <!-- Proposal Interactivity -->
  <div class="proposal-box" id="proposalSection">
    <div class="proposal-question" id="proposalText">তুমি কি আমার প্রস্তাবে রাজি? 🙈</div>
    
    <div class="action-buttons" id="choiceContainer">
      <button class="btn-choice btn-accept" onclick="submitDecision('YES')">
        <i class="fa-solid fa-heart"></i> হ্যাঁ, রাজি! 🥰
      </button>
      <button class="btn-choice btn-reject" id="btnReject" onclick="submitDecision('NO')">
        না.. 🥺
      </button>
    </div>

    <div class="alert-popup alert-success" id="statusMessage"></div>
    <a href="#" class="wa-link-btn" id="waDirectBtn" target="_blank">
      <i class="fa-brands fa-whatsapp"></i> সরাসরি WhatsApp-এ বলুন
    </a>
  </div>

  <!-- Custom Feedback Text Input -->
  <div class="feedback-container">
    <label>✍️ মনের কোনো কথা থাকলে লিখে পাঠিয়ে দিন:</label>
    <div class="feedback-input-row">
      <input type="text" id="customReply" class="feedback-input" placeholder="এখানে লিখুন...">
      <button class="btn-send-msg" id="btnSendReply" onclick="submitCustomText()">পাঠান</button>
    </div>
  </div>

  <div class="site-footer">
    Created with ❤️ by <span style="color:#ff6b9d;">CYBER 67 EMON</span>
  </div>
</div>

<audio id="audioTrack" loop></audio>

<script>
const DB_URL = "https://wish-studio-app-default-rtdb.firebaseio.com";
const urlParams = new URLSearchParams(window.location.search);
const wishId = urlParams.get('id');
const audioEl = document.getElementById('audioTrack');
const musicBtn = document.getElementById('musicBtn');
let isAudioPlaying = false;
let globalWaNumber = "";

// ১. ব্যাকগ্রাউন্ডে হার্ট পার্টিকেল তৈরি
function createHeartParticles() {
  const container = document.getElementById('heartBg');
  const symbols = ['💖', '💕', '🌸', '✨', '❤️'];
  for (let i = 0; i < 22; i++) {
    const heart = document.createElement('div');
    heart.className = 'floating-heart';
    heart.innerText = symbols[Math.floor(Math.random() * symbols.length)];
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (Math.random() * 5 + 6) + "s";
    heart.style.animationDelay = (Math.random() * 6) + "s";
    container.appendChild(heart);
  }
}
createHeartParticles();

// ২. Firebase থেকে উইশ লোড করা
if (wishId) {
  fetch(`${DB_URL}/wishes/${wishId}.json`)
    .then(res => res.json())
    .then(data => {
      if (!data) return;

      if (data.sender && data.receiver) {
        document.getElementById('namesHeading').innerText = `${data.receiver} & ${data.sender}`;
      }
      if (data.message) {
        document.getElementById('letterContent').innerText = data.message;
      }
      if (data.proposalNote) {
        document.getElementById('proposalText').innerText = data.proposalNote;
      }
      if (data.avatar) {
        document.getElementById('avatarImg').src = data.avatar;
      }
      if (data.wa) {
        globalWaNumber = data.wa.replace(/[^0-9]/g, '');
      }
      if (data.audio) {
        audioEl.src = data.audio;
        playAudioSafe();
      }

      // যদি আগে থেকেই উত্তর দেওয়া থাকে
      if (data.response) {
        displayCompletedStatus(data.response);
      }
    })
    .catch(err => {
      console.error(err);
      document.getElementById('letterContent').innerText = "তথ্য লোড করতে সমস্যা হয়েছে। ইন্টারনেট চেক করুন।";
    });
} else {
  document.getElementById('letterContent').innerText = "কোনো উইশ আইডি পাওয়া যায়নি।";
}

// ৩. অডিও হ্যান্ডলার
function playAudioSafe() {
  audioEl.play().then(() => {
    isAudioPlaying = true;
    musicBtn.classList.add('spin');
  }).catch(() => {
    isAudioPlaying = false;
    musicBtn.classList.remove('spin');
    // ব্রাউজার অটোপ্লে ব্লক করলে প্রথম ক্লিকে প্লে হবে
    document.body.addEventListener('click', () => {
      if (!isAudioPlaying && audioEl.src) {
        audioEl.play().then(() => {
          isAudioPlaying = true;
          musicBtn.classList.add('spin');
        }).catch(()=>{});
      }
    }, { once: true });
  });
}

function toggleAudio() {
  if (audioEl.paused) {
    audioEl.play().then(() => {
      isAudioPlaying = true;
      musicBtn.classList.add('spin');
    });
  } else {
    audioEl.pause();
    isAudioPlaying = false;
    musicBtn.classList.remove('spin');
  }
}

// ৪. "না" বাটন টাচ করলে সরে যাওয়ার মজার ইফেক্ট
const btnReject = document.getElementById('btnReject');
btnReject.addEventListener('mouseover', moveRejectButton);
btnReject.addEventListener('touchstart', (e) => {
  e.preventDefault();
  moveRejectButton();
});

function moveRejectButton() {
  const x = (Math.random() - 0.5) * 160;
  const y = (Math.random() - 0.5) * 80;
  btnReject.style.transform = `translate(${x}px, ${y}px)`;
}

// ৫. Firebase-এ YES / NO পাঠানো (অ্যাপসের লাইভ ফিডে তৎক্ষণাৎ যাবে)
function submitDecision(answer) {
  if (!wishId) return;

  const btnContainer = document.getElementById('choiceContainer');
  btnContainer.style.opacity = '0.5';
  btnContainer.style.pointerEvents = 'none';

  fetch(`${DB_URL}/wishes/${wishId}.json`, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ response: answer })
  })
  .then(() => {
    displayCompletedStatus(answer);
  })
  .catch(err => {
    console.error(err);
    alert("রেসপন্স পাঠানো যায়নি। ইন্টারনেট কানেকশন চেক করুন।");
    btnContainer.style.opacity = '1';
    btnContainer.style.pointerEvents = 'all';
  });
}

function displayCompletedStatus(answer) {
  document.getElementById('choiceContainer').style.display = 'none';
  const statusBox = document.getElementById('statusMessage');
  const isYes = answer === "YES";
  
  statusBox.className = isYes ? 'alert-popup alert-success' : 'alert-popup alert-success';
  statusBox.style.display = 'block';
  statusBox.innerHTML = isYes 
    ? `🎉 আপনি রাজি হয়েছেন! আপনার উত্তরটি অ্যাপে পাঠানো হয়েছে। 🥰` 
    : `💔 আপনার উত্তর (${answer}) অ্যাপে পাঠানো হয়েছে।`;

  if (globalWaNumber && isYes) {
    const waBtn = document.getElementById('waDirectBtn');
    waBtn.href = `https://wa.me/${globalWaNumber}?text=${encodeURIComponent("আমি তোমার প্রপোজাল গ্রহণ করেছি! 🥰💖")}`;
    waBtn.style.display = 'block';
  }
}

// ৬. স্পেশাল মেসেজ Firebase-এ পাঠানো (অ্যাপের ফিডে যাবে)
function submitCustomText() {
  const input = document.getElementById('customReply');
  const text = input.value.trim();
  if (!text || !wishId) return;

  const sendBtn = document.getElementById('btnSendReply');
  sendBtn.disabled = true;
  sendBtn.innerText = "...";

  fetch(`${DB_URL}/wishes/${wishId}.json`, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ customFeedback: text })
  })
  .then(() => {
    sendBtn.disabled = false;
    sendBtn.innerText = "পাঠান";
    input.value = "";
    alert("আপনার মেসেজটি সফলভাবে পৌঁছে গেছে! 💌");
  })
  .catch(err => {
    console.error(err);
    sendBtn.disabled = false;
    sendBtn.innerText = "পাঠান";
    alert("মেসেজটি পাঠানো সম্ভব হয়নি।");
  });
}
</script>
</body>
</html>
